[package]
name = "netboozt"
version = "3.1.0"
description = "Network Optimization Tool for Windows"
authors = ["LOUST <opensource@loust.pro>"]
license = "Apache-2.0"
repository = "https://github.com/LOUST-PRO/NetBoozt_InternetUpgrade"
edition = "2021"
rust-version = "1.70"
default-run = "netboozt"

# Disable automatic binary discovery — only explicitly-declared [[bin]] targets
# are built. This prevents accidental compilation of test/bench binaries.
autobins = false

# See more keys at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
lazy_static = "1.4"
# Los crates de Tauri se fijan al mismo minor que sus paquetes npm
# (ver platforms/tauri/pnpm-lock.yaml). El CLI de Tauri aborta el build si
# el major.minor del crate no coincide con el del paquete npm, y como
# Cargo.lock está gitignored, un "2" sin fijar hace que cargo resuelva a la
# última versión publicada mientras el lado npm se queda en la fijada:
# las dos mitades derivan con cada release y el CI se rompe solo.
tauri-plugin-fs = "~2.5.1"
tauri-plugin-dialog = "~2.7.1"
tauri-plugin-shell = "~2.3.5"
tauri-plugin-notification = "~2.3.3"
signal-hook = "0.3"

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Services",
] }
windows-service = "0.6"

[features]
# This feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "netboozt"
path = "src/main.rs"

[[bin]]
name = "netboozt-headless"
path = "src/bin/netboozt-headless.rs"
